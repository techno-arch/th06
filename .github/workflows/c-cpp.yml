name: C/C++ CI


on:
  push:
    branches: [ "portable" ]
  pull_request:
    branches: [ "portable" ]

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      # Step 1: Checkout repository
      - uses: actions/checkout@v4

      # Step 2: Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git uuid-dev

      # Step 3: Clone the Premake repository and checkout the specific commit (fbc341d)
      - name: Clone Premake repository at commit fbc341d
        run: |
          git clone https://github.com/premake/premake-core.git
          cd premake-core
          git checkout fbc341d  # Checkout the specific commit
          make -f Bootstrap.mak linux PLATFORM=ARM64

      # Step 4: Set up Premake
      - name: Set up Premake
        run: |
          sudo cp bin/release/premake5 /usr/local/bin

      # Step 5: Generate build files with Premake
      - name: Generate build files with Premake
        run: premake5 gmake --cc=gcc

      # Step 6: Install dependencies (SDL2, etc.)
      - name: Install dependencies
        run: |
          sudo apt-get install -y build-essential libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libasound2-dev

      # Step 7: Build the project
      - name: Build the project
        run: |
          cd build
          make
